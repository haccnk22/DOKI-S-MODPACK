<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile Settings - Doki's Modpacks</title>
  <meta name="description" content="Manage your account profile settings, update username, add email address, and change password.">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/auth.js"></script>
  <script src="/js/navbar.js" defer></script>
  <style>
    .profile-card {
      max-width: 720px;
      margin: 0 auto;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 2rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .profile-header {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border-color);
    }
    .profile-avatar-box {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(45, 212, 191, 0.15);
      border: 2px solid #2dd4bf;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #2dd4bf;
      font-size: 2rem;
      flex-shrink: 0;
    }
    .profile-title-group h1 {
      font-size: 1.6rem;
      margin: 0 0 0.25rem 0;
      color: #ffffff;
    }
    .profile-meta-text {
      font-size: 0.9rem;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title {
      font-size: 1.2rem;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>
  <header>
    <div class="nav-container">
      <div class="nav-brand-group">
        <a href="/" class="logo">
          <span class="logo-cube"></span>
          <span>DOKI'S MODPACKS</span>
        </a>
        <nav class="nav-links">
          <a href="/" class="nav-link">Home</a>
          <a href="/modpacks.html" class="nav-link">Modpacks</a>
          <a href="/events.html" class="nav-link">Events</a>
          <a href="/about-minecraft.html" class="nav-link">About Minecraft</a>
          <a href="/about-website.html" class="nav-link">About Website</a>
        </nav>
      </div>
      <div class="nav-actions" id="nav-actions"></div>
    </div>
  </header>

  <main>
    <div class="page-container">
      <div class="profile-card">
        <!-- Header Info -->
        <div class="profile-header">
          <div class="profile-avatar-box">
            <svg class="icon-svg" style="width: 38px; height: 38px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          </div>
          <div class="profile-title-group">
            <h1 id="profile-display-name">User Settings</h1>
            <div class="profile-meta-text">
              <span id="profile-role-badge" class="phase-badge" style="background: rgba(45, 212, 191, 0.15); color: #2dd4bf; border-color: #2dd4bf;">
                User
              </span>
              <span id="profile-created-date">Member</span>
            </div>
          </div>
        </div>

        <!-- Section 1: Edit Profile Details -->
        <div style="margin-bottom: 2.5rem;">
          <div class="section-title">
            <svg class="icon-svg icon-svg-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            Personal Profile Details
          </div>

          <form id="profile-form">
            <div class="form-group" style="margin-bottom: 1.25rem;">
              <label class="form-label" for="username-input">Username *</label>
              <input type="text" id="username-input" class="form-control" placeholder="Your display username" required minlength="3">
            </div>

            <div class="form-group" style="margin-bottom: 1.25rem;">
              <label class="form-label" for="email-input">Email Address</label>
              <input type="email" id="email-input" class="form-control" placeholder="yourname@example.com">
            </div>

            <div class="form-group" style="margin-bottom: 1.5rem;">
              <label class="form-label" for="bio-input">Gamer Bio / Minecraft Tagline</label>
              <textarea id="bio-input" class="form-control" rows="3" placeholder="Tell the community about your favorite modpacks, playstyle, or server build projects..."></textarea>
            </div>

            <div id="profile-msg" style="margin-bottom: 1rem; font-weight: 600; font-size: 0.9rem; display: none;"></div>

            <button type="submit" id="btn-save-profile" class="btn btn-primary" style="background: #2dd4bf; color: #0f172a; font-weight: bold; padding: 0.75rem 1.5rem;">
              Save Profile Details
            </button>
          </form>
        </div>

        <!-- Section 2: Change Password -->
        <div style="padding-top: 1.5rem; border-top: 1px solid var(--border-color);">
          <div class="section-title">
            <svg class="icon-svg icon-svg-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            Change Security Password
          </div>

          <form id="password-form">
            <div class="form-group" style="margin-bottom: 1.25rem;">
              <label class="form-label" for="current-password-input">Current Password *</label>
              <input type="password" id="current-password-input" class="form-control" placeholder="••••••••" required>
            </div>

            <div class="form-group" style="margin-bottom: 1.25rem;">
              <label class="form-label" for="new-password-input">New Password * (Min 6 chars)</label>
              <input type="password" id="new-password-input" class="form-control" placeholder="••••••••" required minlength="6">
            </div>

            <div class="form-group" style="margin-bottom: 1.5rem;">
              <label class="form-label" for="confirm-password-input">Confirm New Password *</label>
              <input type="password" id="confirm-password-input" class="form-control" placeholder="••••••••" required minlength="6">
            </div>

            <div id="password-msg" style="margin-bottom: 1rem; font-weight: 600; font-size: 0.9rem; display: none;"></div>

            <button type="submit" id="btn-change-password" class="btn btn-secondary" style="font-weight: bold; padding: 0.75rem 1.5rem;">
              Update Password
            </button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="footer-container">
      <nav class="footer-nav">
        <a href="/">Home</a>
        <a href="/modpacks.html">Modpacks</a>
        <a href="/events.html">Events</a>
        <a href="/about-minecraft.html">About Minecraft</a>
        <a href="/about-website.html">About Website</a>
      </nav>
      <div class="disclaimer">
        Not an official Minecraft product. Not approved by or associated with Mojang or Microsoft.
      </div>
    </div>
  </footer>

  <script type="module">
    import { auth } from '/js/auth.js';

    document.addEventListener('DOMContentLoaded', async () => {
      const mcAuth = window.MCAuth || { getCurrentUser: async () => ({ loggedIn: false }), getToken: () => null, setAuth: () => {} };
      const authData = await mcAuth.getCurrentUser();

      if (!authData || !authData.loggedIn || !authData.user) {
        window.location.href = '/login.html';
        return;
      }

      const user = authData.user;

      // Populate initial values
      document.getElementById('profile-display-name').textContent = user.username;
      document.getElementById('username-input').value = user.username;
      document.getElementById('email-input').value = user.email || '';
      document.getElementById('bio-input').value = user.bio || '';

      const roleBadge = document.getElementById('profile-role-badge');
      if (user.role === 'admin') {
        roleBadge.textContent = '👑 Admin';
        roleBadge.style.color = '#2dd4bf';
        roleBadge.style.borderColor = '#2dd4bf';
      } else {
        roleBadge.textContent = '⛏️ Miner';
      }

      if (user.createdAt) {
        document.getElementById('profile-created-date').textContent = `Member since ${new Date(user.createdAt).toLocaleDateString()}`;
      }

      // Profile details submission
      const profileForm = document.getElementById('profile-form');
      const profileMsg = document.getElementById('profile-msg');
      const btnSaveProfile = document.getElementById('btn-save-profile');

      profileForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username-input').value.trim();
        const email = document.getElementById('email-input').value.trim();
        const bio = document.getElementById('bio-input').value.trim();

        btnSaveProfile.disabled = true;
        btnSaveProfile.textContent = 'Saving...';
        profileMsg.style.display = 'none';

        try {
          const token = mcAuth.getToken();
          const headers = { 'Content-Type': 'application/json' };
          if (token) headers['Authorization'] = `Bearer ${token}`;

          const res = await fetch('/api/auth/profile', {
            method: 'PUT',
            headers,
            body: JSON.stringify({ username, email, bio })
          });

          const data = await res.json();
          if (res.ok && data.success) {
            if (data.token) {
              mcAuth.setAuth(data.token, data.user);
            }
            document.getElementById('profile-display-name').textContent = data.user.username;
            profileMsg.style.display = 'block';
            profileMsg.style.color = '#2dd4bf';
            profileMsg.textContent = '✅ Profile details saved successfully!';
          } else {
            profileMsg.style.display = 'block';
            profileMsg.style.color = '#ef4444';
            profileMsg.textContent = `❌ ${data.error || 'Failed to save profile'}`;
          }
        } catch (err) {
          profileMsg.style.display = 'block';
          profileMsg.style.color = '#ef4444';
          profileMsg.textContent = '❌ Network error saving profile';
        } finally {
          btnSaveProfile.disabled = false;
          btnSaveProfile.textContent = 'Save Profile Details';
        }
      });

      // Password change submission
      const passwordForm = document.getElementById('password-form');
      const passwordMsg = document.getElementById('password-msg');
      const btnChangePassword = document.getElementById('btn-change-password');

      passwordForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const currentPassword = document.getElementById('current-password-input').value;
        const newPassword = document.getElementById('new-password-input').value;
        const confirmPassword = document.getElementById('confirm-password-input').value;

        if (newPassword !== confirmPassword) {
          passwordMsg.style.display = 'block';
          passwordMsg.style.color = '#ef4444';
          passwordMsg.textContent = '❌ New password and confirmation do not match';
          return;
        }

        btnChangePassword.disabled = true;
        btnChangePassword.textContent = 'Updating...';
        passwordMsg.style.display = 'none';

        try {
          const token = mcAuth.getToken();
          const headers = { 'Content-Type': 'application/json' };
          if (token) headers['Authorization'] = `Bearer ${token}`;

          const res = await fetch('/api/auth/password', {
            method: 'PUT',
            headers,
            body: JSON.stringify({ currentPassword, newPassword })
          });

          const data = await res.json();
          if (res.ok && data.success) {
            passwordForm.reset();
            passwordMsg.style.display = 'block';
            passwordMsg.style.color = '#2dd4bf';
            passwordMsg.textContent = '✅ Security password changed successfully!';
          } else {
            passwordMsg.style.display = 'block';
            passwordMsg.style.color = '#ef4444';
            passwordMsg.textContent = `❌ ${data.error || 'Failed to change password'}`;
          }
        } catch (err) {
          passwordMsg.style.display = 'block';
          passwordMsg.style.color = '#ef4444';
          passwordMsg.textContent = '❌ Network error changing password';
        } finally {
          btnChangePassword.disabled = false;
          btnChangePassword.textContent = 'Update Password';
        }
      });
    });
  </script>
</body>
</html>
